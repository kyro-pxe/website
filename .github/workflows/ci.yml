name: CI

# Checks only. Cloudflare Pages builds and publishes the site itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        # Reads the version from "packageManager" in package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm run check

      - name: Lint Markdown
        run: pnpm run lint:md

      - name: Build
        run: pnpm build

      # After the build: some tests read the pages in dist/.
      - name: Test
        run: pnpm test

      # Paths that start with / are looked up in dist/. Other settings are
      # in lychee.toml. The action downloads the lychee release named here.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --root-dir "${{ github.workspace }}/dist"
            'dist/**/*.html' '*.md' 'docs/**/*.md'
